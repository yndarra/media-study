<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>media-study</title>
  <!-- Стили по областям; порядок важен (дальше – поверх): общее, списки и
       карточки, окна, статистика, настройки, редактор. -->
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/library.css">
  <link rel="stylesheet" href="/css/modals.css">
  <link rel="stylesheet" href="/css/stats.css">
  <link rel="stylesheet" href="/css/settings.css">
  <link rel="stylesheet" href="/css/editor.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<div id="shell">
  <!-- Левое меню: разделы приложения и ссылка на видео, которое сейчас правится. -->
  <nav id="menu" class="sidebar">
    <div class="panel-head">
      <a class="brand" href="#/media" title="К списку медиа">Media Study</a>
      <button class="panel-close" data-toggle="left" title="Скрыть меню"><svg viewBox="0 0 20 20"><path d="M12 5l-5 5 5 5"/></svg></button>
    </div>
    <!-- Режим: видео или аудио. От него зависят все разделы, кроме "Настроек". -->
    <div id="mode-switch" class="mode-switch seg-switch">
      <!-- Выбранный режим – "пилюля" под кнопками: переезжает между ними, два
           слоя градиента (видео / аудио) плавно сменяют друг друга. -->
      <span class="mode-pill"><i class="pill-video"></i><i class="pill-audio"></i></span>
      <button data-k="video">Видео</button>
      <button data-k="audio">Аудио</button>
    </div>
    <!-- Разделы идут снизу вверх по ходу работы: добавить -> обработать -> видео. -->
    <!-- "Медиа": список видео или аудио (название и значок – по режиму). -->
    <a href="#/media" data-menu="media" id="menu-media"><span class="menu-icon-host"></span><span class="menu-label">Видео</span><span class="menu-count" id="count-media"></span></a>
    <a href="#/process" data-menu="process"><svg class="menu-icon" viewBox="0 0 20 20"><path d="M3 10h2l2-5 3 10 3-8 2 3h2"/></svg><span>Обработка</span><span class="menu-count" id="count-process"></span></a>
    <a href="#/add" data-menu="add"><svg class="menu-icon" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M10 6.5v7M6.5 10h7"/></svg><span>Добавить</span></a>
    <a href="#/stats" data-menu="stats"><svg class="menu-icon" viewBox="0 0 20 20"><path d="M3.5 16.5h13"/><path d="M6 14V9M10 14V5M14 14v-3"/></svg><span>Статистика</span></a>
    <a href="#/settings" data-menu="settings"><svg class="menu-icon" viewBox="0 0 20 20"><path d="M4 6h12M4 14h12"/><circle cx="8" cy="6" r="1.8"/><circle cx="12.5" cy="14" r="1.8"/></svg><span>Настройки</span></a>
    <div id="menu-editing" class="menu-editing hidden">
      <a id="menu-editing-link" href="#"></a>
    </div>
    <!-- Что сейчас идёт в фоне: скачивание, обработка, выгрузка в Anki. -->
    <div class="activity hidden">
      <div id="activity-list" class="muted small"></div>
    </div>
    <!-- Сервер работает без окна консоли: остановить и посмотреть журнал – здесь. -->
    <div class="server-row">
      <button id="server-log" class="server-btn wide" title="Журнал сервера в реальном времени">Журнал</button>
      <button id="server-restart" class="server-btn icon" title="Перезапустить сервер"><svg viewBox="0 0 20 20"><path d="M15.5 10a5.5 5.5 0 1 1-1.6-3.9"/><path d="M14.5 3v3.5H11"/></svg></button>
      <button id="server-stop" class="server-btn icon" title="Остановить сервер"><svg viewBox="0 0 20 20"><path d="M10 3v6"/><path d="M6.2 5.6a6 6 0 1 0 7.6 0"/></svg></button>
    </div>
  </nav>

  <!-- Кнопки, которыми скрытые панели открываются обратно. -->
  <button id="open-left" class="panel-open" data-toggle="left" title="Показать меню"><svg viewBox="0 0 20 20"><path d="M4 6h12M4 10h12M4 14h12"/></svg></button>
  <button id="open-right" class="panel-open" data-toggle="right" title="Показать список фрагментов"><svg viewBox="0 0 20 20"><path d="M4 6h12M4 10h12M4 14h12"/></svg></button>

  <main id="main">
  <section id="view-videos" class="view hidden"></section>
  <section id="view-video" class="view hidden"></section>
  <section id="view-process" class="view hidden"></section>
  <section id="view-add" class="view hidden"></section>
  <section id="view-stats" class="view hidden"></section>
  <section id="view-settings" class="view hidden"></section>
  <section id="view-editor" class="view hidden">
  <div id="app">
    <div id="video-wrap">
      <!-- Обёртка сдвигается вверх на высоту чёрной полосы записи (Letterbox в js/editor/view.js). -->
      <div id="video-inner">
        <video id="video" preload="auto" playsinline></video>
        <!-- Снимок кадра остановки поверх видео (см. Player._freeze). -->
        <canvas id="freeze" class="hidden"></canvas>
      </div>
    </div>

    <div id="status-row" class="row3">
      <div class="group left">
        <button id="play-pause" class="icon-btn" title="Воспроизвести / пауза"></button>
        <button id="replay-btn" class="icon-btn" title="Повтор с начала отрезка">
          <svg viewBox="0 0 20 20"><path d="M16 10a6 6 0 1 1-1.8-4.3"/><path d="M16 3.5v3h-3"/><path d="M10 7l3 5h-6z" fill="#5fb4f0" stroke="none"/></svg>
        </button>
        <button id="replay-marker-btn" class="icon-btn" title="Повтор с жёлтой метки" disabled>
          <svg viewBox="0 0 20 20"><path d="M16 10a6 6 0 1 1-1.8-4.3"/><path d="M16 3.5v3h-3"/><path d="M7 8h6l-3 5z" fill="#ffc857" stroke="none"/></svg>
        </button>
        <button id="mode-toggle" class="icon-btn"></button>
        <button id="auto-toggle" class="icon-btn"></button>
        <!-- Время и номер кадра – посередине между кнопками слева и статусами по центру. -->
        <span id="time-readout" class="readout"></span>
      </div>
      <div class="group center">
        <span id="fragment-status"></span>
        <span id="deleted-badge" class="badge deleted hidden">Удалено</span>
        <span id="text-edited-badge" class="badge edited hidden">Текст изменён</span>
        <span id="bounds-edited-badge" class="badge edited hidden">Отрезок изменён</span>
        <span id="merged-badge" class="badge origin hidden">Объединён</span>
        <span id="split-badge" class="badge origin hidden">Часть разделённого</span>
        <span id="padding-badge" class="badge info hidden"></span>
        <span id="stage3-badge" class="badge stage3 hidden"></span>
        <button id="review-badge" class="badge review hidden" title="Текст проверен — снять пометку">Проверить текст</button>
      </div>
      <div class="group right">
        <!-- Скорость воспроизведения (общая для всех видео): −0.1× / 1× / +0.1× -->
        <button id="speed-down" class="icon-btn speed-btn" title="Медленнее (до 0.5×)">−</button>
        <button id="speed-value" class="speed-value" title="Скорость воспроизведения — клик: вернуть 1×">1.0×</button>
        <button id="speed-up" class="icon-btn speed-btn" title="Быстрее (до 2×)">+</button>
        <span class="sep"></span>
        <button id="reset-btn" class="icon-btn" title="Reset — вернуть границы, текст и запас как было и снять пометку удаления">
          <svg viewBox="0 0 20 20"><path d="M4 10a6 6 0 1 0 1.8-4.3"/><path d="M4 3.5v3h3"/></svg>
        </button>
        <span class="sep"></span>
        <button id="undo-btn" class="icon-btn" title="Назад — отменить действие" disabled>
          <svg viewBox="0 0 20 20"><path d="M7.5 5L3.5 9l4 4"/><path d="M3.5 9h8.5a4.5 4.5 0 0 1 0 9H9"/></svg>
        </button>
        <button id="redo-btn" class="icon-btn" title="Вперёд — вернуть отменённое" disabled>
          <svg viewBox="0 0 20 20"><path d="M12.5 5l4 4-4 4"/><path d="M16.5 9H8a4.5 4.5 0 0 0 0 9h3"/></svg>
        </button>
      </div>
    </div>

    <canvas id="timeline"></canvas>

    <div id="edit-row" class="row5">
      <div class="group left">
        <button id="step-back-10" class="step-btn" title="На 10 кадров назад (текущий кадр или выбранная граница)">−10</button>
        <button id="step-back-1" class="step-btn" title="На 1 кадр назад">−1</button>
      </div>
      <div class="group">
        <button id="pad-left-minus" class="step-btn" title="Запас слева от отрезка: −3 с">−3 с</button>
        <button id="snap-start" class="icon-btn" disabled>
          <svg viewBox="0 0 20 20"><path d="M3.5 3.5v13"/><path d="M16.5 10H7M10.5 6.5L7 10l3.5 3.5"/></svg>
        </button>
        <button id="pad-left-plus" class="step-btn" title="Запас слева от отрезка: +3 с (у края видео — сколько осталось)">+3 с</button>
      </div>
      <div class="group center">
        <button id="set-start" class="icon-btn" title="Задать начало отрезка по текущему кадру">
          <svg viewBox="0 0 20 20"><path d="M5 3v14"/><path d="M9 6.5l6 3.5-6 3.5z" fill="currentColor"/></svg>
        </button>
        <button id="set-end" class="icon-btn" title="Задать конец отрезка по текущему кадру">
          <svg viewBox="0 0 20 20"><path d="M15 3v14"/><path d="M11 6.5l-6 3.5 6 3.5z" fill="currentColor"/></svg>
        </button>
        <span class="sep"></span>
        <button id="merge-prev" class="icon-btn" title="Объединить с предыдущим">
          <svg viewBox="0 0 20 20"><rect x="2" y="5" width="6" height="10" rx="1" fill="currentColor"/><path d="M18 10h-7M13.5 7l-3 3 3 3"/></svg>
        </button>
        <button id="merge-next" class="icon-btn" title="Объединить со следующим">
          <svg viewBox="0 0 20 20"><rect x="12" y="5" width="6" height="10" rx="1" fill="currentColor"/><path d="M2 10h7M6.5 7l3 3-3 3"/></svg>
        </button>
        <button id="split-btn" class="icon-btn" title="Разделить на два по текущему кадру (кадр остаётся в левой части)">
          <svg viewBox="0 0 20 20"><rect x="2" y="5" width="6" height="10" rx="1"/><rect x="12" y="5" width="6" height="10" rx="1"/><path d="M10 2v16" stroke-dasharray="2 2"/></svg>
        </button>
        <span class="sep"></span>
        <button id="delete-soft" class="icon-btn" title="Пометить на удаление">
          <svg viewBox="0 0 20 20"><path d="M3.5 5.5h13M8 5.5V3.5h4v2M5.5 5.5l1 11h7l1-11"/></svg>
        </button>
        <button id="delete-hard" class="icon-btn danger" title="Удалить окончательно (только объединённый фрагмент или часть разделённого)">
          <svg viewBox="0 0 20 20"><path d="M3.5 5.5h13M8 5.5V3.5h4v2M5.5 5.5l1 11h7l1-11"/><path d="M8.3 9l3.4 5M11.7 9l-3.4 5"/></svg>
        </button>
      </div>
      <div class="group">
        <button id="pad-right-minus" class="step-btn" title="Запас справа от отрезка: −3 с">−3 с</button>
        <button id="snap-end" class="icon-btn" disabled>
          <svg viewBox="0 0 20 20"><path d="M16.5 3.5v13"/><path d="M3.5 10H13M9.5 6.5L13 10l-3.5 3.5"/></svg>
        </button>
        <button id="pad-right-plus" class="step-btn" title="Запас справа от отрезка: +3 с (у края видео — сколько осталось)">+3 с</button>
      </div>
      <div class="group right">
        <button id="step-fwd-1" class="step-btn" title="На 1 кадр вперёд">+1</button>
        <button id="step-fwd-10" class="step-btn" title="На 10 кадров вперёд (текущий кадр или выбранная граница)">+10</button>
      </div>
    </div>

    <div id="text-panel">
      <div id="context-preview">
        <div id="prev-text" class="ctx dim"></div>
        <div id="cur-text" class="ctx cur" contenteditable="plaintext-only" spellcheck="false" title="Нажмите, чтобы исправить текст"></div>
        <div id="next-text" class="ctx dim"></div>
      </div>
      <!-- После объединения: на стыке ". Заглавная" – склеить в одну фразу. -->
      <!-- Сообщения редактора (ошибки, "передано в Anki" и т.п.) – под фразами, во всю ширину. -->
      <div id="toast" class="toast hidden"></div>
      <div id="junction-row" class="hidden"><button id="junction-join" class="step-btn small-btn">Склеить в одну фразу</button></div>
    </div>

    <!-- Ряд навигации: половины слева и справа от "1 / N" – в каждой кнопки у края
         и средняя кнопка ровно посередине оставшегося места. -->
    <div id="nav-row" class="nav-grid">
      <div class="nav-half">
      <div class="group left">
        <button id="nav-back-10" class="step-btn" title="На 10 фрагментов назад">« 10</button>
        <button id="nav-back-1" class="step-btn" title="Предыдущий фрагмент">‹ Назад</button>
      </div>
      <div class="nav-mid group stage3">
        <span id="stage3-eta" class="readout hidden"></span>
        <button id="stage3-btn" class="step-btn" title="Передать в Anki все фрагменты с первого по текущий включительно">Anki</button>
        <!-- Вернуть текущий фрагмент из Anki на правку (не открывая Anki): после
             правки "Anki" перепишет ту же карточку. -->
        <button id="return-btn" class="icon-btn" title="Вернуть из Anki на правку – потом «Anki» перепишет ту же карточку">
          <svg viewBox="0 0 20 20"><path d="M8 5L4 9l4 4"/><path d="M4.5 9H12a4 4 0 0 1 0 8H9"/></svg>
        </button>
        <span class="sep"></span>
        <!-- Соседние фразы (серые сверху и снизу): удалённые пропускаются (по умолчанию) или видны. -->
        <button id="skip-deleted-btn" class="icon-btn"></button>
        <!-- Связанные границы: внутренняя граница двигается вместе с соседней. -->
        <button id="link-bounds-btn" class="icon-btn"></button>
        <!-- Говорящие на карточках этого видео (имена серым в конце карточки). -->
        <button id="speakers-btn" class="icon-btn"></button>
      </div>
      </div>
      <div class="group center">
        <span id="position-indicator"></span>
      </div>
      <div class="nav-half">
      <div class="nav-mid" id="nav-mid-right">
        <!-- Не озвучено (Rover молчит): в Anki – без видео, только текст с подписью Rover:. -->
        <!-- Говорящий в начале фразы: ‹ – из предыдущих фрагментов (ещё раз – раньше),
             × – убрать говорящего, R – Rover (ещё раз – как было), › – из следующих. -->
        <div class="speaker-btns">
          <button id="speaker-prev" class="step-btn speaker-btn" title="Говорящий из предыдущих фрагментов (ещё раз – более ранний)">‹</button>
          <button id="speaker-clear" class="step-btn speaker-btn" title="Убрать говорящего – остаётся только реплика (ещё раз – как было)">×</button>
          <button id="speaker-rover" class="step-btn speaker-btn" title="Говорящий – Rover (ещё раз – как было)">R</button>
          <button id="speaker-next" class="step-btn speaker-btn" title="Говорящий из следующих фрагментов (ещё раз – более поздний)">›</button>
        </div>
        <span class="sep"></span>
        <!-- Отметки фрагмента (значки): не озвучено – в Anki только текст; только
             озвучка – в Anki звук без картинки. -->
        <button id="unvoiced-btn" class="icon-btn mark-btn" title="Реплика не озвучена: в Anki – без видео"></button>
        <button id="sound-btn" class="icon-btn mark-btn" title="Только озвучка: в Anki – звук без картинки"></button>
      </div>
      <div class="group right">
        <button id="nav-fwd-1" class="step-btn" title="Следующий фрагмент">Вперёд ›</button>
        <button id="nav-fwd-10" class="step-btn" title="На 10 фрагментов вперёд">10 »</button>
        <!-- На последнем фрагменте вместо "вперёд" и "10 »": всё видео — отредактировано. -->
        <button id="finish-btn" class="step-btn finish hidden" title="Отметить всё видео отредактированным">Финиш</button>
      </div>
      </div>
    </div>
  </div>
  </section>
  </main>

  <!-- Правый сайдбар редактора: все фрагменты видео с фильтром. -->
  <aside id="fraglist" class="sidebar hidden">
    <div class="fraglist-head">
      <button class="panel-close" data-toggle="right" title="Скрыть список фрагментов"><svg viewBox="0 0 20 20"><path d="M8 5l5 5-5 5"/></svg></button>
      <!-- Фильтр (свой выпадающий список, picker.js); слева от подписи – сколько фрагментов. -->
      <div id="fraglist-filter-host"></div>
    </div>
    <div id="fraglist-items"></div>
  </aside>
</div>

  <!-- Язык интерфейса: словарь и перевод поверх страницы – раньше всего (см. i18n.js). -->
  <script src="/i18n-en.js"></script>
  <script src="/i18n.js"></script>
  <script src="/api.js"></script>
  <script src="/timeline.js"></script>
  <script src="/audio.js"></script>
  <script src="/player.js"></script>
  <script src="/textedit.js"></script>
  <script src="/fraglist.js"></script>
  <script src="/picker.js"></script>
  <!-- Страницы вокруг редактора (раньше – один pages.js): помощники, окна,
       анимации, оболочка (меню, роутер), затем разделы – дописываются в Pages. -->
  <script src="/js/format.js"></script>
  <script src="/js/dialogs.js"></script>
  <script src="/js/motion.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/pages/core.js"></script>
  <script src="/js/pages/library.js"></script>
  <script src="/js/pages/process.js"></script>
  <script src="/js/pages/add.js"></script>
  <script src="/js/pages/stats.js"></script>
  <script src="/js/pages/settings.js"></script>
  <!-- Появление текста по буквам (везде, кроме редактора). -->
  <script src="/textfx.js"></script>
  <!-- Редактор (раньше – один app.js): состояние и помощники, вид плеера, App
       по частям (основа, текст, границы, режимы), кнопки и клавиши, запуск. -->
  <script src="/js/editor/state.js"></script>
  <script src="/js/editor/view.js"></script>
  <script src="/js/editor/app.js"></script>
  <script src="/js/editor/text.js"></script>
  <script src="/js/editor/bounds.js"></script>
  <script src="/js/editor/modes.js"></script>
  <script src="/js/editor/keymap.js"></script>
  <script src="/js/editor/input.js"></script>
  <script src="/js/editor/main.js"></script>
  <script src="/timer.js"></script>
  <script src="/audiovis.js"></script>
</body>
</html>
